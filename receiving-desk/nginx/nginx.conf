user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;
    gzip              off;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ACME challenge (Let's Encrypt HTTP-01) + redirect to HTTPS
    server {
        listen      80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Clearnet HTTPS
    # Replace YOURDOMAIN.TLD with the actual domain before starting.
    server {
        listen      443 ssl;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN.TLD/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.TLD/privkey.pem;

        ssl_trusted_certificate /etc/letsencrypt/live/YOURDOMAIN.TLD/chain.pem;
        ssl_stapling            on;
        ssl_stapling_verify     on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff                                         always;
        add_header X-Frame-Options           DENY                                            always;
        add_header Referrer-Policy           no-referrer                                     always;
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'"   always;

        root /var/www/html;

        location = /.well-known/security.txt {
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache";
        }

        location = /pgp-key.asc {
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache";
        }

        location / {
            return 404;
        }
    }

    # Tor hidden service listener — internal only, Tor container connects here on port 8080
    server {
        listen      8080;
        server_name _;

        add_header X-Content-Type-Options nosniff    always;
        add_header X-Frame-Options        DENY       always;
        add_header Referrer-Policy        no-referrer always;

        root /var/www/html;

        location = /.well-known/security.txt {
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache";
        }

        location = /pgp-key.asc {
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache";
        }

        location / {
            return 404;
        }
    }
}
