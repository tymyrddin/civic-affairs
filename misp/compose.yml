# MISP: signal store and routing layer
# Image: ghcr.io/misp/misp-docker/misp-core — verify tag at github.com/MISP/misp-docker/pkgs/container/misp-docker%2Fmisp-core
# Production: pin by digest — docker inspect --format='{{index .RepoDigests 0}}' IMAGE

services:
  misp:
    image: ghcr.io/misp/misp-docker/misp-core:v2.4.196
    restart: unless-stopped
    depends_on:
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - misp-data:/var/www/MISP/app/files
      - misp-logs:/var/www/MISP/app/tmp/logs
      - ./10-supervisor.conf:/etc/supervisor/conf.d/10-supervisor.conf:ro
      # Branding from the repo so it survives a clone. custom.css lands in the image
      # webroot; the logo is served as the home icon (files/img/custom) and as the host
      # org logo (files/img/orgs/<org name>.png, matched by org name). The MISP.custom_css,
      # MISP.home_logo and MISP.title_text settings are applied by ctl on start.
      - ./custom.css:/var/www/MISP/app/webroot/css/custom.css:ro
      # home_logo: MISP validates the filename against webroot/img/custom but renders it
      # from files/img/custom, so the logo is mounted into both.
      - ./logo.png:/var/www/MISP/app/webroot/img/custom/cde-logo.png:ro
      - ./logo.png:/var/www/MISP/app/files/img/custom/cde-logo.png:ro
      - "./logo.png:/var/www/MISP/app/files/img/orgs/Civic Defence Establishment.png:ro"
    tmpfs:
      - /run:size=64m,mode=0755
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      - misp-internal
      - pipeline-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/users/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  misp-db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    volumes:
      - misp-db-data:/var/lib/mysql
    networks:
      misp-internal:
        aliases:
          - db
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  misp-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    user: redis
    command: >
      redis-server
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode yes
    networks:
      misp-internal:
        aliases:
          - redis
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  misp-data:
  misp-db-data:
  misp-logs:

networks:
  misp-internal:
    driver: bridge
    internal: true
  pipeline-net:
    name: pipeline-net
    driver: bridge
