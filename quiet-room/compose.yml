# Quiet Room: signal intake, normalisation, and classification
# Suricata and Zeek use network_mode: host for packet capture on the sensor interface.
# Set SENSOR_INTERFACE in .env to the interface carrying monitored traffic (e.g. eth0, ens3).
# The classifier service tails Suricata EVE JSON and Zeek logs and posts a MISP
# event for every signal (tlp:white, reliability 2); a cross-sensor match on a
# destination IP adds a correlated event held for analyst review. The drop log
# under classifier-state is for discredited-source material (written externally,
# pruned here). Zeek logs accumulate in the zeek-logs volume, read-only here.
# Image versions: verify at hub.docker.com/r/jasonish/suricata and hub.docker.com/r/zeek/zeek.

services:
  suricata:
    image: docker.io/jasonish/suricata:7.0.6
    restart: unless-stopped
    env_file: .env
    command: ["-i", "${SENSOR_INTERFACE}"]
    network_mode: host
    volumes:
      - suricata-logs:/var/log/suricata
      - suricata-rules:/etc/suricata/rules
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/suricata/suricata-command.socket || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  zeek:
    image: docker.io/zeek/zeek:6.0.4
    restart: unless-stopped
    env_file: .env
    command: ["zeek", "-i", "${SENSOR_INTERFACE}", "local", "-e", "redef LogAscii::use_json=T;"]
    # Zeek writes its logs to the working directory, so point it at the volume mount;
    # otherwise the logs land in the container root and vanish on recreate.
    working_dir: /opt/zeek/logs
    network_mode: host
    volumes:
      - zeek-logs:/opt/zeek/logs
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "ls /proc/*/exe 2>/dev/null | xargs -I{} readlink {} 2>/dev/null | grep -q zeek"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    restart: unless-stopped
    env_file: .env
    volumes:
      - wazuh-data:/var/ossec/data
      - wazuh-logs:/var/ossec/logs
      - wazuh-etc:/var/ossec/etc
      - wazuh-queue:/var/ossec/queue
    ports:
      - "0.0.0.0:1514:1514/udp"
      - "0.0.0.0:1514:1514/tcp"
      - "127.0.0.1:55000:55000"
    networks:
      - quiet-room-internal
      - quiet-room-public
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:55000/ -o /dev/null -w '%{http_code}' | grep -qE '^[0-9]'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  classifier:
    build:
      context: .
      dockerfile: Dockerfile.classifier
    restart: unless-stopped
    env_file: .env
    volumes:
      - suricata-logs:/var/log/suricata:ro
      - zeek-logs:/opt/zeek/logs:ro
      - classifier-state:/state
    networks:
      - pipeline-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Forward-progress check: healthy when the stored offset has kept pace with
    # eve.json (caught up, whether idle or flowing). Persistently behind means the
    # classifier is stuck (the permission-loop bug, or MISP unreachable spinning the
    # retry), which trips unhealthy after the retries. A 64KB tolerance absorbs normal
    # tail lag between the 1s poll and this check. Idle traffic does not false-alarm,
    # because with nothing arriving the offset already equals the file size.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,sys; off=int((open('/state/offset').read().strip() or '0')) if os.path.exists('/state/offset') else 0; sz=os.path.getsize('/var/log/suricata/eve.json') if os.path.exists('/var/log/suricata/eve.json') else 0; sys.exit(0 if off >= sz - 65536 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  suricata-logs:
  suricata-rules:
  zeek-logs:
  wazuh-data:
  wazuh-logs:
  wazuh-etc:
  wazuh-queue:
  classifier-state:

networks:
  quiet-room-internal:
    driver: bridge
    internal: true
  quiet-room-public:
    driver: bridge
  pipeline-net:
    external: true
    name: pipeline-net
