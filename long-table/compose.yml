# Long Table: correlation, interpretation, and escalation
# OpenCTI provides relationship graph and actor mapping complementing MISP.
# Verify image tags at github.com/OpenCTI-Platform/opencti/releases.
# The MISP connector imports events from MISP into OpenCTI on a configurable interval.
# OPENCTI_ADMIN_TOKEN must be a valid UUID — generate with: uuidgen
# CONNECTOR_MISP_ID must also be a valid UUID — generate a separate one.
# xpack.security is disabled on Elasticsearch (internal network only); enable for production.

services:
  opencti:
    image: opencti/platform:6.2.0
    restart: unless-stopped
    depends_on:
      opencti-elasticsearch:
        condition: service_healthy
      opencti-redis:
        condition: service_healthy
      opencti-minio:
        condition: service_healthy
      opencti-rabbitmq:
        condition: service_healthy
    environment:
      NODE_OPTIONS: "--max-old-space-size=8096"
      APP__PORT: "8080"
      APP__BASE_URL: ${OPENCTI_BASE_URL}
      APP__ADMIN__EMAIL: ${OPENCTI_ADMIN_EMAIL}
      APP__ADMIN__PASSWORD: ${OPENCTI_ADMIN_PASSWORD}
      APP__ADMIN__TOKEN: ${OPENCTI_ADMIN_TOKEN}
      APP__GRAPHQL__PLAYGROUND__ENABLED: "false"
      APP__GRAPHQL__PLAYGROUND__FORCE_DISABLED_INTROSPECTION: "true"
      REDIS__HOSTNAME: opencti-redis
      REDIS__PORT: "6379"
      REDIS__PASSWORD: ${OPENCTI_REDIS_PASSWORD}
      ELASTICSEARCH__URL: http://opencti-elasticsearch:9200
      MINIO__ENDPOINT: opencti-minio
      MINIO__PORT: "9000"
      MINIO__USE_SSL: "false"
      MINIO__ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO__BUCKET_NAME: opencti-bucket
      RABBITMQ__HOSTNAME: opencti-rabbitmq
      RABBITMQ__PORT: "5672"
      RABBITMQ__PORT_MANAGEMENT: "15672"
      RABBITMQ__MANAGEMENT_SSL: "false"
      RABBITMQ__USERNAME: ${RABBITMQ_USER}
      RABBITMQ__PASSWORD: ${RABBITMQ_PASSWORD}
      PROVIDERS__LOCAL__STRATEGY: LocalStrategy
    ports:
      - "127.0.0.1:8888:8080"
    networks:
      - long-table-internal
      - pipeline-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  opencti-worker:
    image: opencti/worker:6.2.0
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      WORKER_LOG_LEVEL: info
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - long-table-internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  opencti-connector-misp:
    image: opencti/connector-misp:6.2.0
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${CONNECTOR_MISP_ID}
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_NAME: MISP
      CONNECTOR_SCOPE: misp-indicator,misp-sighting
      CONNECTOR_LOG_LEVEL: info
      MISP_URL: http://misp
      MISP_REFERENCE_URL: ${MISP_BASEURL}
      MISP_KEY: ${MISP_API_KEY}
      MISP_SSL_VERIFY: "false"
      MISP_DATETIME_ATTRIBUTE: timestamp
      MISP_REPORT_DESCRIPTION: event.info
      MISP_IMPORT_TAGS: Long-Table,tlp:white,tlp:green
      MISP_INTERVAL: "1"
    depends_on:
      opencti:
        condition: service_healthy
    networks:
      - long-table-internal
      - pipeline-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  opencti-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      cluster.name: opencti
    volumes:
      - opencti-esdata:/usr/share/elasticsearch/data
    networks:
      - long-table-internal
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
      - SYS_RESOURCE
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  opencti-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --requirepass ${OPENCTI_REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode yes
    networks:
      - long-table-internal
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${OPENCTI_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  opencti-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - opencti-minio-data:/data
    networks:
      - long-table-internal
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  opencti-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - opencti-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - long-table-internal
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  opencti-esdata:
  opencti-minio-data:
  opencti-rabbitmq-data:

networks:
  long-table-internal:
    driver: bridge
    internal: true
  pipeline-net:
    external: true
